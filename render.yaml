# Blueprint de Render: si en el dashboard elegís "New > Blueprint" y
# apuntás a este repo, Render lee este archivo y configura el servicio
# solo. (También se puede crear el servicio a mano eligiendo "Docker" como
# entorno — este archivo es solo para no tener que tocar nada a mano.)
services:
  - type: web
    name: mi-serie-magica
    runtime: docker
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # lo cargás vos a mano en el dashboard (Environment), nunca en el repo
      - key: FAL_KEY
        sync: false # ídem — clave de fal.ai para arte real de personajes
      - key: OPENAI_API_KEY
        sync: false # ídem — clave de OpenAI para voz real en español
      - key: IMAGE_PROVIDER
        value: fal
      - key: TTS_PROVIDER
        value: openai
      - key: TTS_VOICE
        value: coral
      - key: PUBLIC_BASE_URL
        sync: false # tu URL real de Render, ej: https://mi-serie-magica.onrender.com
    healthCheckPath: /web/index.html
